name: Build SMS Guardian APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu-latest 运行器已预装 Android SDK 并接受好许可证，
      # 无需 android-actions/setup-android（该 Action 会因旧的 tools 包已废弃而失败）。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          if [ -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-34" ]; then
            echo "Android SDK platform 34 is ready."
          else
            echo "Platform 34 not preinstalled; Gradle will download it automatically."
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-guardian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
